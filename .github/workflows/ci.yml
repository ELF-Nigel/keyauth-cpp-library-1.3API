name: ci

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup msbuild
        uses: microsoft/setup-msbuild@v2

      - name: build (release x64)
        shell: pwsh
        run: |
          msbuild .\\library.sln /p:Configuration=Release /p:Platform=x64

      - name: security regression tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64
          call tests\run-tests.cmd

      - name: collect build output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-output | Out-Null
          Get-ChildItem -Path . -Recurse -Filter *.lib | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination build-output -Force
          }

      - name: upload build-output
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output
